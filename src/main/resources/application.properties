# Gemini Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-flash-latest
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={key}

# Activer les logs
logging.level.org.springframework.web=DEBUG
logging.level.Projects.Network=DEBUG


reactor.netty.pool.maxConnections=100
reactor.netty.pool.maxIdleTime=20s

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.packages-to-scan=Projects.Network.controller
springdoc.writer-with-default-pretty-printer=false
springdoc.cache.disabled=false

server.url=${RENDER_EXTERNAL_URL:http://localhost:8080}

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.export.prometheus.enabled=true

# Multipart configuration for WebFlux
spring.webflux.multipart.max-file-size=10MB
spring.webflux.multipart.max-request-size=10MB
spring.codec.max-in-memory-size=10MB
